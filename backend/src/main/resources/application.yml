server:
  port: ${PORT:8080}

spring:
  application:
    name: chulha-chauka-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chulhachauka}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:super-secret-jwt-key-for-chulha-chauka-cloud-kitchen-2026-min-256-bits}
    access-expiry-seconds: 604800
    refresh-expiry-days: 30

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com}
